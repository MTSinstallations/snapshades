<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SnapShades - Custom blinds, shades & shutters delivered to your door. Snap photos, get instant pricing, order online. Professional installation available." />
    <title>SnapShades — Snap. Order. Done.</title>
    
    <!-- JSON-LD for LLM/AI discovery -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "SnapShades",
      "alternateName": "Snap Shades and Shutters",
      "description": "Online retailer of custom blinds, shades, and shutters. Photo-based measurements, instant pricing, three service tiers: DIY, Professional Installation, and Design Consultation.",
      "url": "https://snapshadesandshutters.com",
      "priceRange": "$-$$$",
      "areaServed": "US",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Window Coverings",
        "itemListElement": [
          {"@type": "OfferCatalog", "name": "Blinds"},
          {"@type": "OfferCatalog", "name": "Shades"},
          {"@type": "OfferCatalog", "name": "Shutters"}
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
